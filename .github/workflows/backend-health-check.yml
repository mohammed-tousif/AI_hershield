# Free uptime check for the production backend on AWS EC2 (always on, so this
# is monitoring, not a keep-alive). A failed scheduled run makes GitHub email
# the repository owner. Public-repo Actions minutes are free.
# Scheduled runs only fire from the default branch (main).
name: Backend health check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /api/health
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 20 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" https://13-235-201-166.sslip.io/api/health
