# Render's free instance sleeps after 15 minutes without traffic, and the first
# request after that waits ~40s for it to boot. Pinging the health endpoint every
# 10 minutes keeps it warm. Daytime in India only: GitHub cron runs in UTC, so
# hours 0-17 UTC = about 05:30-23:30 IST (the instance sleeps ~15 min after the
# last ping). That is ~570 of Render's 750 free instance hours a month, leaving
# room for other free services. Public-repo Actions minutes are free.
# Scheduled runs only fire from the default branch (main).
name: Keep backend awake

on:
  schedule:
    - cron: '*/10 0-17 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: curl -fsS --retry 2 --max-time 90 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" https://ai-hershield.onrender.com/api/health
